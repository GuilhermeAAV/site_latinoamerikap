document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

6\" height=\"18\" sc-camel-view-box=\"0 0 24 16\" style=\"border-radius:3px;overflow:hidden;display:block\"><rect width=\"24\" height=\"5.3\" fill=\"#FCD116\"><\u002Frect><rect y=\"5.3\" width=\"24\" height=\"5.3\" fill=\"#003893\"><\u002Frect><rect y=\"10.6\" width=\"24\" height=\"5.4\" fill=\"#CE1126\"><\u002Frect><\u002Fsvg>\n        <svg width=\"26\" height=\"18\" sc-camel-view-box=\"0 0 24 16\" style=\"border-radius:3px;overflow:hidden;display:block\"><rect width=\"24\" height=\"5.3\" fill=\"#D52B1E\"><\u002Frect><rect y=\"5.3\" width=\"24\" height=\"5.3\" fill=\"#F9E300\"><\u002Frect><rect y=\"10.6\" width=\"24\" height=\"5.4\" fill=\"#007934\"><\u002Frect><\u002Fsvg>\n        <svg width=\"26\" height=\"18\" sc-camel-view-box=\"0 0 24 16\" style=\"border-radius:3px;overflow:hidden;display:block\"><rect width=\"24\" height=\"8\" fill=\"#FFFDF8\"><\u002Frect><rect y=\"8\" width=\"24\" height=\"8\" fill=\"#D52B1E\"><\u002Frect><rect width=\"8\" height=\"8\" fill=\"#0039A6\"><\u002Frect><\u002Fsvg>\n        <span style=\"font-size:12px;font-weight:600;color:rgba(255,247,238,.85);margin-left:6px\">…et toute l'América Latina<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <!-- EVENTS -->\n  <section id=\"events\" style=\"padding:88px 4px 0;scroll-margin-top:20px\" data-screen-label=\"Événements\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n      <div>\n        <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#E3315F\">Agenda du quadri<\u002Fp>\n        <h2 style=\"margin:10px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;letter-spacing:-0.025em\">Prochains événements<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-family:'Caveat',cursive;font-size:26px;color:#E5372A\">¡No te lo pierdas!<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin-top:32px\">\n      <sc-for list=\"{{ events }}\" as=\"ev\" hint-placeholder-count=\"3\">\n        <article style=\"border-radius:18px;background:#FFFDF8;border:1px solid #E7D6BE;overflow:hidden;box-shadow:0 10px 30px rgba(120,60,20,.10);display:flex;flex-direction:column\" style-hover=\"transform:translateY(-3px);box-shadow:0 16px 36px rgba(120,60,20,.16)\">\n          <div style=\"height:160px;position:relative\">\n            <x-import component-from-global-scope=\"image-slot\" id=\"{{ ev.slotId }}\" shape=\"rect\" placeholder=\"{{ ev.imgHint }}\" hint-size=\"100%,160px\"><\u002Fx-import>\n          <\u002Fdiv>\n          <div style=\"height:8px;background:{{ ev.accent }}\"><\u002Fdiv>\n          <div style=\"padding:24px 26px 26px;display:flex;flex-direction:column;gap:8px;flex:1\">\n            <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:{{ ev.accent }}\">{{ ev.date }}<\u002Fspan>\n            <h3 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.02em;line-height:1.1\">{{ ev.title }}<\u002Fh3>\n            <p style=\"margin:0;color:#6B4A38;font-size:15px\">{{ ev.place }}<\u002Fp>\n            <p style=\"margin:2px 0 0;color:#2E1B12;font-size:14.5px;line-height:1.55;flex:1\">{{ ev.desc }}<\u002Fp>\n            <div><a href=\"#join\" style=\"display:inline-block;margin-top:12px;background:{{ ev.accent }};color:{{ ev.btnText }};font-weight:700;font-size:14px;padding:11px 22px;border-radius:9999px;text-decoration:none\" style-hover=\"filter:brightness(1.08);text-decoration:none;color:{{ ev.btnText }}\">Je participe<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:20px 0 0;font-size:14px;color:#6B4A38\">Le programme complet est publié chaque mois sur notre <a href=\"#join\">Instagram<\u002Fa>.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SEPARATOR -->\n  <svg sc-camel-view-box=\"0 0 1200 44\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:30px;color:#E3315F;margin:72px 0 0\">\n    <defs><pattern id=\"pp-sep\" width=\"50\" height=\"44\" sc-camel-pattern-units=\"userSpaceOnUse\">\n      <path d=\"M1 0 H49 V22 L25 42 L1 22 Z M25 7 a6 6 0 1 0 0.01 0 Z M25 24 a3 3 0 1 0 0.01 0 Z\" fill=\"currentColor\" fill-rule=\"evenodd\"><\u002Fpath>\n    <\u002Fpattern><\u002Fdefs>\n    <line x1=\"0\" y1=\"1.5\" x2=\"1200\" y2=\"1.5\" stroke=\"currentColor\" stroke-width=\"3\"><\u002Fline>\n    <rect x=\"0\" y=\"2\" width=\"1200\" height=\"42\" fill=\"url(#pp-sep)\"><\u002Frect>\n  <\u002Fsvg>\n\n  <!-- CONVERSATION TABLES -->\n  <section id=\"tables\" style=\"padding:72px 4px 0;scroll-margin-top:20px\" data-screen-label=\"Tables de conversation\">\n    <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#2FB3C9\">Chaque semaine<\u002Fp>\n    <h2 style=\"margin:10px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;letter-spacing:-0.025em\">Tables de conversation<\u002Fh2>\n    <p style=\"margin:14px 0 0;max-width:600px;font-size:16.5px;line-height:1.6;color:#6B4A38\">Pratique ton espagnol ou ton portugais autour d'un verre, dans une ambiance détendue. Tous les niveaux sont bienvenus — des natifs animent chaque table.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;margin-top:30px\">\n      <article style=\"border-radius:18px;background:#FFFDF8;border:1px solid #E7D6BE;box-shadow:0 10px 30px rgba(120,60,20,.10);padding:30px 32px;display:flex;gap:20px;align-items:flex-start\">\n        <span style=\"flex:none;width:54px;height:54px;border-radius:9999px;background:#2FB3C9;color:#FFF7EE;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px\">ES<\u002Fspan>\n        <div>\n          <h3 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-0.02em\">Mesa de conversación<\u002Fh3>\n          <p style=\"margin:6px 0 0;font-weight:700;font-size:14px;color:#2FB3C9;letter-spacing:0.04em;text-transform:uppercase\">Tous les lundis · 19h30<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:15px;line-height:1.55;color:#6B4A38\">Au kot, autour d'un maté ou d'une agua de jamaica. Thème différent chaque semaine.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"border-radius:18px;background:#FFFDF8;border:1px solid #E7D6BE;box-shadow:0 10px 30px rgba(120,60,20,.10);padding:30px 32px;display:flex;gap:20px;align-items:flex-start\">\n        <span style=\"flex:none;width:54px;height:54px;border-radius:9999px;background:#2FB3C9;color:#FFF7EE;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px\">PT<\u002Fspan>\n        <div>\n          <h3 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-0.02em\">Roda de conversa<\u002Fh3>\n          <p style=\"margin:6px 0 0;font-weight:700;font-size:14px;color:#2FB3C9;letter-spacing:0.04em;text-transform:uppercase\">Tous les mercredis · 19h30<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:15px;line-height:1.55;color:#6B4A38\">Portugais du Brésil et du Portugal, musique et cafezinho compris. Sem estresse.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ABOUT -->\n  <section id=\"kap\" style=\"padding:88px 4px 0;scroll-margin-top:20px\" data-screen-label=\"Le kap\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:44px;align-items:center\">\n      <div>\n        <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#9B45D6\">Le kap<\u002Fp>\n        <h2 style=\"margin:10px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;letter-spacing:-0.025em;text-wrap:balance\">Un kot-à-projet, douze passionné·es, un continent<\u002Fh2>\n        <p style=\"margin:16px 0 0;font-size:16.5px;line-height:1.65;color:#2E1B12\">LatinoAmeriKap est le kot-à-projet de l'UCLouvain dédié aux cultures d'Amérique latine. Étudiant·es latinos et belges y organisent ensemble des événements ouverts à tout le campus : de la salsa à la cumbia, des arepas au ceviche, du cinéma aux débats.<\u002Fp>\n        <p style=\"margin:12px 0 0;font-size:16.5px;line-height:1.65;color:#6B4A38\">Pas besoin de parler espagnol ni de savoir danser — juste d'avoir envie de découvrir. <span style=\"font-family:'Caveat',cursive;font-size:24px;color:#9B45D6\">¡Todos son bienvenidos!<\u002Fspan><\u002Fp>\n        <a href=\"#join\" style=\"display:inline-block;margin-top:24px;background:#9B45D6;color:#FFF7EE;font-weight:700;font-size:15px;padding:13px 26px;border-radius:9999px;text-decoration:none\" style-hover=\"filter:brightness(1.1);text-decoration:none;color:#FFF7EE\">Rencontrer l'équipe<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"position:relative\">\n        <div style=\"position:relative;height:420px;border-radius:26px;overflow:hidden;box-shadow:0 18px 44px rgba(120,60,20,.16);transform:rotate(1.5deg)\">\n          <x-import component-from-global-scope=\"image-slot\" id=\"kap-team\" shape=\"rect\" placeholder=\"Photo de l'équipe du kap (soirée, cuisine, fiesta…)\" hint-size=\"100%,420px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:-14px;bottom:-14px;background:#F7C948;color:#2E1B12;font-family:'Caveat',cursive;font-weight:600;font-size:24px;padding:8px 20px;border-radius:9999px;box-shadow:0 10px 24px rgba(120,60,20,.18);transform:rotate(-3deg);pointer-events:none\">desde 1998<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- JOIN -->\n  <section id=\"join\" style=\"padding:96px 4px 88px;scroll-margin-top:20px\" data-screen-label=\"Rejoindre\">\n    <div style=\"position:relative;overflow:hidden;border-radius:26px;background:{{ joinBg }};color:{{ joinFg }};box-shadow:0 18px 44px rgba(120,60,20,.18);text-align:center;padding:64px 40px 58px\">\n      <svg sc-camel-view-box=\"0 0 1200 44\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:26px;color:rgba(255,255,255,.55);position:absolute;inset:0 0 auto\">\n        <defs><pattern id=\"pp-join\" width=\"50\" height=\"44\" sc-camel-pattern-units=\"userSpaceOnUse\">\n          <path d=\"M1 0 H49 V22 L25 42 L1 22 Z M25 7 a6 6 0 1 0 0.01 0 Z\" fill=\"currentColor\" fill-rule=\"evenodd\"><\u002Fpath>\n        <\u002Fpattern><\u002Fdefs>\n        <rect x=\"0\" y=\"0\" width=\"1200\" height=\"44\" fill=\"url(#pp-join)\"><\u002Frect>\n      <\u002Fsvg>\n      <p style=\"margin:0;font-family:'Caveat',cursive;font-weight:600;font-size:30px\">¿Te unes a la fiesta?<\u002Fp>\n      <h2 style=\"margin:8px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:48px;letter-spacing:-0.025em;text-wrap:balance\">Rejoins LatinoAmeriKap<\u002Fh2>\n      <p style=\"margin:14px auto 0;max-width:520px;font-size:16.5px;line-height:1.6\">Membre, bénévole d'un soir ou simple curieux·se : écris-nous, passe au kot, ou viens directement à la prochaine table de conversation.<\u002Fp>\n      <div style=\"display:flex;gap:14px;justify-content:center;margin-top:28px;flex-wrap:wrap\">\n        <a href=\"mailto:latinoamerikap@uclouvain.be\" style=\"background:#2E1B12;color:#F7C948;font-weight:700;font-size:15px;padding:14px 28px;border-radius:9999px;text-decoration:none\" style-hover=\"filter:brightness(1.15);text-decoration:none\">Écris-nous<\u002Fa>\n        <a href=\"https://instagram.com\" style=\"background:rgba(255,255,255,.22);border:1.5px solid {{ joinFg }};color:{{ joinFg }};font-weight:700;font-size:15px;padding:14px 28px;border-radius:9999px;text-decoration:none\" style-hover=\"background:rgba(255,255,255,.35);text-decoration:none\">@latinoamerikap<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n\n<!-- FOOTER -->\n<footer style=\"background:#2E1B12;color:#FFF7EE\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:52px 32px 40px;display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap;align-items:flex-start\">\n    <div>\n      <p style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:-0.02em\">LatinoAmeriKap<\u002Fp>\n      <p style=\"margin:8px 0 0;font-size:14px;color:rgba(255,247,238,.7);line-height:1.6\">Kot-à-projet · UCLouvain<br>Louvain-la-Neuve, Belgique<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:40px;flex-wrap:wrap;font-size:14px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <a href=\"#events\" style=\"color:#FFF7EE\">Événements<\u002Fa>\n        <a href=\"#tables\" style=\"color:#FFF7EE\">Tables de conversation<\u002Fa>\n        <a href=\"#kap\" style=\"color:#FFF7EE\">Le kap<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <a href=\"mailto:latinoamerikap@uclouvain.be\" style=\"color:#FFF7EE\">latinoamerikap@uclouvain.be<\u002Fa>\n        <a href=\"https://instagram.com\" style=\"color:#FFF7EE\">Instagram<\u002Fa>\n        <a href=\"https://facebook.com\" style=\"color:#FFF7EE\">Facebook<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 32px 36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n    <sc-if value=\"{{ flagsOn }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;gap:10px;align-items:center\">\n        <svg width=\"22\" height=\"15\" sc-camel-view-box=\"0 0 24 16\" style=\"border-radius:2px;overflow:hidden;display:block\"><rect width=\"24\" height=\"8\" fill
