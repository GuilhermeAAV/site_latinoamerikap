# Hébergement temporaire sur GitHub Pages :
# https://guilhermeaav.github.io/site_latinoamerikap/
#
# Chaque push sur main (y compris les commits « via Pages CMS »)
# rebuilde le site et le redéploie. Le jour où le site part chez son
# hébergeur définitif, il suffira de supprimer ce fichier — le build
# se fait alors sans --base (site servi à la racine du domaine).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le site vit sous /site_latinoamerikap/ sur github.io, d'où le --base.
      - run: npm run build -- --base=/site_latinoamerikap/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
